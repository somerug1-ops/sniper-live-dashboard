<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Output</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="search-header">
      <input
        type="text"
        id="jobInput"
        placeholder="Enter Job ID..."
        autocomplete="off"
        spellcheck="false"
        autofocus
      >
    </div>

    <div class="output-container" id="output">
      <div class="notice" id="notice">Enter a Job ID above to view live search output.</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
